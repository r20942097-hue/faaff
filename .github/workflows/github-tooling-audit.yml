name: GitHub workflow quality audit

on:
  pull_request:
  workflow_dispatch:

# This workflow never publishes releases, writes repository content, or reads secrets.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint / syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned and checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflow files
        run: actionlint -oneline

  zizmor:
    name: zizmor / block medium and high security findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_OFFLINE: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for official zizmor wheel
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Inspect zizmor wheel SHA-256 for fully pinned installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zizmor-dist"
          python -m pip download --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/zizmor-dist" 'zizmor==1.31.1'
          sha256sum "$RUNNER_TEMP"/zizmor-dist/*.whl
      - name: Install pinned zizmor release
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: zizmor==1.31.1
          zizmor --version
      - name: Gate unsuppressed medium-or-higher security findings
        run: zizmor --offline --min-severity=medium --format=plain .
      - name: Inventory all ignored or suppressed findings (advisory only)
        run: zizmor --offline --no-ignores --no-exit-codes --format=plain .

  gitleaks:
    name: gitleaks / block detected secrets with redaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check proposed changes for secrets (no source writes)
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'Manual mode: scan current working tree; no Git history included.'
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" \
              dir --redact=100 --no-banner --no-color --exit-code 1 .
          else
            echo 'Pull request mode: scan commits introduced by the PR.'
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" \
              git --redact=100 --no-banner --no-color --exit-code 1 --log-opts="origin/main..HEAD" .
          fi
      - name: Inventory redacted historical secret findings (advisory only)
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          echo 'Scan all available Git history; fully redact values and do not gate on baseline findings.'
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" \
            git --redact=100 --no-banner --no-color --exit-code 0 --log-opts="--all" .

      - name: Sensitivity regression / synthetic secret must be detected
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks-synthetic"
          mkdir -p "$dir"
          trap 'rm -rf "$dir"' EXIT
          # Generate an entirely artificial AWS-shaped identifier at runtime.
          # Never write the value to logs, the repository, or workflow artifacts.
          python - "$dir" <<'PY'
          from pathlib import Path
          from secrets import choice
          import string
          import sys
          alphabet = string.ascii_uppercase + "234567"
          fake = "AKIA" + "".join(choice(alphabet) for _ in range(16))
          Path(sys.argv[1], "fixture.txt").write_text(
              "aws_access_key_id = '" + fake + "'\n", encoding="utf-8"
          )
          PY
          image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          set +e
          docker run --rm --network none -v "$dir:/fixture:ro" -w /fixture "$image" \
            dir --redact=100 --no-banner --no-color --exit-code 1 . >/dev/null 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Gitleaks synthetic positive detection FAILED (expected 1, got $status)"
            exit 1
          fi
          echo 'PASS: the pinned Gitleaks engine rejects an ephemeral synthetic credential.'
