name: GitHub workflow quality audit

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'integrations/agent-tools/github-quality/**'
  workflow_dispatch:

# This workflow never publishes releases, writes repository content, or reads secrets.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint / syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned and checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflow files
        run: actionlint -oneline

  zizmor:
    name: zizmor / offline security findings (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZIZMOR_OFFLINE: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for official zizmor wheel
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned zizmor release
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: zizmor==1.31.1
          zizmor --version
      - name: Report security findings without modifying repository
        run: zizmor --offline --format=plain --no-exit-codes .
