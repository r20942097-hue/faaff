name: Management Governance

on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.md'
      - 'docs/PROJECT_MANAGEMENT_POLICY.md'
      - 'docs/ARTIFACT_GOVERNANCE.md'
      - 'docs/RETENTION_POLICY.md'
      - 'docs/SUPPLY_CHAIN_POLICY.md'
      - 'docs/project_registry.json'
      - 'schemas/**'
      - 'templates/**'
      - 'tools/validate_project_registry.py'
      - 'tools/validate_release_manifest.py'
      - 'tools/promotion_decision.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate project registry
        run: python tools/validate_project_registry.py docs/project_registry.json

      - name: Validate release manifest template
        run: python tools/validate_release_manifest.py templates/RELEASE_MANIFEST.example.json

      - name: Verify promotion decision is candidate-only
        shell: bash
        run: |
          decision="$(python tools/promotion_decision.py templates/RELEASE_MANIFEST.example.json)"
          test "$decision" = "CANDIDATE_ELIGIBLE"
          printf 'promotion_decision=%s\n' "$decision"
