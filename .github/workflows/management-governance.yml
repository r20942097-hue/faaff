name: Management Governance
on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.md'
      - 'docs/**'
      - 'schemas/**'
      - 'templates/**'
      - 'policies/**'
      - 'tools/**'
      - 'tests/test_governance.py'
      - 'tests/test_product_archive_audit.py'
      - '.github/workflows/management-governance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate imported portfolio and blocked example
        run: |
          python tools/validate_project_registry.py docs/project_registry.json
          python tools/validate_release_manifest.py templates/RELEASE_MANIFEST.example.json
          test "$(python tools/promotion_decision.py templates/RELEASE_MANIFEST.example.json)" = "DEV_OR_NO_GO"
      - name: Verify generated index
        run: |
          python tools/render_index.py docs/project_registry.json > /tmp/generated-project-index.md
          diff -u PROJECT_INDEX.md /tmp/generated-project-index.md
      - name: Run management regression tests
        run: |
          python -m unittest discover -s tests -p test_governance.py -v
          python -m unittest discover -s tests -p test_product_archive_audit.py -v
      - name: Validate retention plan
        run: python tools/retention_plan.py docs/project_registry.json
