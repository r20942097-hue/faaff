name: Synthetic extension sandbox probe
on:
  push:
    branches: [codex/synthetic-extension-sandbox-20261030]
  workflow_dispatch:
permissions: {}
jobs:
  extension-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Run self-contained synthetic local extension test
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import http.server, json, os, pathlib, shutil, subprocess, tempfile, threading
          class Handler(http.server.BaseHTTPRequestHandler):
           def log_message(self,*args):pass
           def do_GET(self):
            b=b'<!doctype html><html><body><div id="probe">before</div></body></html>';self.send_response(200);self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
          binpath=shutil.which('chromium') or shutil.which('chromium-browser')
          if not binpath:raise SystemExit('BLOCKED: Chromium not on PATH')
          print('browser version:',subprocess.run([binpath,'--version'],capture_output=True,text=True,timeout=8).stdout.strip(),flush=True)
          s=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler);t=threading.Thread(target=s.serve_forever,daemon=True);t.start()
          try:
           with tempfile.TemporaryDirectory(prefix='synthetic-ext-') as tmp:
            root=pathlib.Path(tmp);ext=root/'extension';ext.mkdir();profile=root/'profile'
            (ext/'manifest.json').write_text(json.dumps({'manifest_version':3,'name':'Synthetic local test','version':'1.0.0','content_scripts':[{'matches':['http://127.0.0.1/*'],'js':['content.js'],'run_at':'document_idle'}]}))
            (ext/'content.js').write_text("document.getElementById('probe').textContent='extension-loaded';")
            args=[binpath,'--headless','--disable-gpu','--disable-background-networking','--no-first-run','--disable-extensions-except='+str(ext),'--load-extension='+str(ext),'--user-data-dir='+str(profile),'--virtual-time-budget=5000','--dump-dom',f'http://127.0.0.1:{s.server_port}/']
            print('sandbox bypass flag: absent; effective isolation: UNVERIFIED',flush=True)
            try:p=subprocess.run(args,capture_output=True,text=True,timeout=35)
            except subprocess.TimeoutExpired:raise SystemExit('FAIL: browser launch/render timed out')
            print('browser exit:',p.returncode,flush=True)
            if p.returncode:print('browser stderr tail:',p.stderr[-3000:],flush=True);raise SystemExit('FAIL: sandbox-requested browser launch failed')
            if '<div id="probe">extension-loaded</div>' not in p.stdout:raise SystemExit('FAIL: expected content-script mutation was not observed')
            print('PASS: synthetic content script mutated local page; no product loaded')
          finally:s.shutdown();s.server_close();t.join(3)
          PYCODE
