name: Synthetic extension sandbox probe
on:
  push:
    branches: [codex/synthetic-extension-sandbox-20261030]
  workflow_dispatch:
permissions: {}
jobs:
  extension-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Permit user namespaces for the verified Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          command -v apparmor_parser
          python3 - <<'PYCODE'
          import os, pathlib, shutil, stat, sys
          binary = shutil.which('chromium') or shutil.which('chromium-browser')
          if not binary: sys.exit('BLOCKED: Chromium missing')
          target = pathlib.Path(os.path.realpath(binary))
          print('REAL_EXECUTABLE:', target, flush=True)
          for item in [target, *target.parents]:
              info = item.stat()
              print('PATH_COMPONENT:', item, 'UID:', info.st_uid, 'MODE:', oct(stat.S_IMODE(info.st_mode)), flush=True)
              if info.st_uid != 0 or info.st_mode & 0o022:
                  sys.exit('BLOCKED: path is not root-owned and protected against group/other writes')
          if any(c in str(target) for c in ('"', '\n', '\r', '{', '}', '*', '?', '[')):
              sys.exit('BLOCKED: unsafe profile path')
          profile = '#include <tunables/global>\nprofile codex_synthetic_chromium "' + str(target) + '" flags=(unconfined) {\n  userns,\n}\n'
          pathlib.Path('/tmp/codex-synthetic-chromium.apparmor').write_text(profile)
          PYCODE
          echo 'AppArmor before profile:'
          sudo aa-status 2>&1 | head -40 || true
          sudo apparmor_parser -r /tmp/codex-synthetic-chromium.apparmor
          echo 'Restricted profile loaded for exact executable; Chromium sandbox effectiveness must be checked separately.'
      - name: Observe Chromium process sandbox evidence
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil, subprocess, tempfile, time
          binary = shutil.which('chromium') or shutil.which('chromium-browser')
          with tempfile.TemporaryDirectory(prefix='sandbox-observe-') as tmp:
              p = subprocess.Popen([binary, '--headless', '--disable-gpu', '--no-first-run',
                  '--disable-background-networking', '--remote-debugging-port=0',
                  '--user-data-dir='+tmp, 'about:blank'], stdout=subprocess.DEVNULL, stderr=open(pathlib.Path(tmp, 'stderr.log'), 'w'))
              try:
                  deadline = time.monotonic() + 50
                  while not pathlib.Path(tmp, 'DevToolsActivePort').exists() and time.monotonic() < deadline and p.poll() is None:
                      time.sleep(.2)
                  if p.poll() is not None or not pathlib.Path(tmp, 'DevToolsActivePort').exists():
                      print('BROWSER_POLL:', p.poll(), 'STDERR:', pathlib.Path(tmp, 'stderr.log').read_text()[:3000], flush=True)
                      raise SystemExit('BLOCKED: browser did not become ready')
                  time.sleep(2)
                  allprocs = {}
                  for entry in pathlib.Path('/proc').iterdir():
                      if not entry.name.isdigit(): continue
                      try:
                          status = (entry/'status').read_text()
                          fields = dict(line.split(':',1) for line in status.splitlines() if ':' in line)
                          allprocs[int(entry.name)] = (entry, fields)
                      except (OSError, ValueError): pass
                  descendants = {p.pid}
                  for _ in range(8):
                      new = {pid for pid, (_, f) in allprocs.items() if int(f.get('PPid','-1').strip()) in descendants}
                      if new <= descendants: break
                      descendants |= new
                  print('BROWSER_MAIN_PID:', p.pid, 'PROCESS_COUNT:', len(descendants), flush=True)
                  for pid in sorted(descendants):
                      if pid not in allprocs: continue
                      entry, f = allprocs[pid]
                      try:
                          cmd = (entry/'cmdline').read_bytes().replace(b'\\0',b' ').decode(errors='replace')
                          kind = next((x for x in cmd.split() if x.startswith('--type=')), 'browser')
                          ns = os.readlink(entry/'ns/user')
                          apparmor = (entry/'attr/current').read_text().strip()
                          print('PROCESS:', kind, 'PID:', pid, 'Seccomp:', f.get('Seccomp','?').strip(),
                                'NoNewPrivs:', f.get('NoNewPrivs','?').strip(),
                                'USERNS:', ns, 'APPARMOR:', apparmor, flush=True)
                      except OSError: pass
                  print('OBSERVATION ONLY: process indicators do not independently certify all sandbox layers.')
              finally:
                  p.terminate()
                  try: p.wait(timeout=8)
                  except subprocess.TimeoutExpired: p.kill(); p.wait()
          PYCODE
      - name: Compare sandbox and synthetic extension startup
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import http.server,json,os,pathlib,shutil,subprocess,tempfile,threading
          
          def run(args,timeout=30):
           try:
            p=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
            print('EXIT:',p.returncode,'STDOUT:',p.stdout[:400].replace('\n',' '),flush=True)
            if p.stderr:print('STDERR_HEAD:',p.stderr[:3500],flush=True)
            return p
           except (subprocess.TimeoutExpired,OSError) as e:print('EXECUTION_ERROR:',type(e).__name__,flush=True);return None
          
          print('UID:',os.getuid(),flush=True)
          for path in ['/proc/sys/kernel/unprivileged_userns_clone','/proc/sys/kernel/apparmor_restrict_unprivileged_userns','/sys/module/apparmor/parameters/enabled','/proc/self/attr/current']:
           try: print(path, pathlib.Path(path).read_text().strip(),flush=True)
           except OSError as e:print(path,type(e).__name__,flush=True)
          if shutil.which('unshare'):
           print('PROBE: unprivileged namespace',flush=True);run(['unshare','-Ur','true'],10)
          binpath=shutil.which('chromium') or shutil.which('chromium-browser')
          if not binpath:raise SystemExit('BLOCKED: chromium missing')
          print('CHROMIUM_PATH:',os.path.realpath(binpath),flush=True);run([binpath,'--version'],10)
          class H(http.server.BaseHTTPRequestHandler):
           def log_message(self,*args):pass
           def do_GET(self):
            b=b'<!doctype html><html><body><div id="probe">before</div></body></html>';self.send_response(200);self.send_header('Content-Length',str(len(b)));self.end_headers();self.wfile.write(b)
          s=http.server.ThreadingHTTPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start()
          try:
           with tempfile.TemporaryDirectory(prefix='sandbox-diagnosis-') as tmp:
            root=pathlib.Path(tmp);ext=root/'ext';ext.mkdir()
            (ext/'manifest.json').write_text(json.dumps({'manifest_version':3,'name':'Synthetic local probe','version':'1.0.0','content_scripts':[{'matches':['http://127.0.0.1/*'],'js':['content.js']}]}))
            (ext/'content.js').write_text("document.getElementById('probe').textContent='extension-loaded';")
            base=[binpath,'--headless','--disable-gpu','--disable-background-networking','--no-first-run','--virtual-time-budget=5000','--dump-dom']
            url=f'http://127.0.0.1:{s.server_port}/'
            print('PROBE: Chromium without extension, no sandbox bypass',flush=True)
            plain=run(base+['--user-data-dir='+str(root/'plain'),url])
            print('PROBE: Chromium with synthetic extension, no sandbox bypass',flush=True)
            extension=run(base+['--disable-extensions-except='+str(ext),'--load-extension='+str(ext),'--user-data-dir='+str(root/'ext-profile'),url])
            if plain and plain.returncode==0 and extension and extension.returncode==0 and '<div id="probe">extension-loaded</div>' in extension.stdout:
             print('RESULT: extension PASS; effective sandbox layers not independently verified',flush=True)
            else:raise SystemExit('RESULT: FAIL or BLOCKED; see separate probe outputs')
          finally:s.shutdown();s.server_close()
          PYCODE

      - name: Test synthetic worker, popup and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d "$RUNNER_TEMP/extension-flow.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          npm install --prefix "$workdir" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.62.1
          export NODE_PATH="$workdir/node_modules"
          export PROBE_ROOT="$workdir"
          sudo PROBE_ROOT="$workdir" NODE_PATH="$workdir/node_modules" unshare --net -- bash -c 'ip link set lo up; exec sudo -u runner env PROBE_ROOT="$PROBE_ROOT" NODE_PATH="$NODE_PATH" node' <<'NODECODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');
          const { execFileSync } = require('child_process');
          const root = process.env.PROBE_ROOT;
          const extension = path.join(root, 'fixture');
          const profile = path.join(root, 'profile');
          fs.mkdirSync(extension);
          fs.writeFileSync(path.join(extension, 'manifest.json'), JSON.stringify({manifest_version:3,name:'Synthetic flow probe',version:'1.0.0',background:{service_worker:'worker.js'},action:{default_popup:'popup.html'},permissions:['storage']}));
          fs.writeFileSync(path.join(extension, 'worker.js'), "chrome.runtime.onMessage.addListener((m,s,reply)=>{if(m==='ping')reply('pong')});");
          fs.writeFileSync(path.join(extension, 'popup.html'), '<!doctype html><div id="result">pending</div><script src="popup.js"></script>');
          fs.writeFileSync(path.join(extension, 'popup.js'), "chrome.runtime.sendMessage('ping',r=>{document.querySelector('#result').textContent=r||'failed'});");
          const executable = execFileSync('which', ['chromium'], {encoding:'utf8'}).trim();
          console.log('PLAYWRIGHT_VERSION:', require('playwright/package.json').version);
          console.log('CHROMIUM_VERSION:', execFileSync(executable, ['--version'], {encoding:'utf8'}).trim());
          console.log('SCOPE: synthetic fixture in an isolated network namespace');
          const net = require('net');
          console.log('NETNS:', fs.readlinkSync('/proc/self/ns/net'));
          for (const args of [['route'],['-6','route']]) {
            const routes = execFileSync('ip',args,{encoding:'utf8'}).trim();
            console.log('ROUTES:', args.join(' '), routes || '(none)');
            if (routes) throw new Error('unexpected external route');
          }
          function verifyNoRoute() {
            return new Promise((resolve,reject) => {
              const socket = net.createConnection({host:'1.1.1.1',port:443});
              socket.setTimeout(2000);
              socket.on('connect',()=>{socket.destroy();reject(new Error('unexpected external connection'));});
              socket.on('timeout',()=>{socket.destroy();reject(new Error('blocked but no-route not established'));});
              socket.on('error',error=>error.code === 'ENETUNREACH' ? resolve() : reject(error));
            });
          }
          async function launch() {
            return await chromium.launchPersistentContext(profile, {executablePath:executable,channel:'chromium',headless:true,chromiumSandbox:true,timeout:60000,args:[`--disable-extensions-except=${extension}`,`--load-extension=${extension}`]});
          }
          async function popup(context) {
            let worker = context.serviceWorkers()[0];
            if (!worker) worker = await context.waitForEvent('serviceworker', {timeout:30000});
            const id = new URL(worker.url()).hostname;
            if (!/^[a-p]{32}$/.test(id)) throw new Error('invalid extension id');
            const page = await context.newPage();
            await page.goto(`chrome-extension://${id}/popup.html`);
            await page.waitForFunction(() => document.querySelector('#result')?.textContent === 'pong', null, {timeout:15000});
            return {page,id};
          }
          (async () => {
            await verifyNoRoute();
            console.log('NETWORK_NEGATIVE_CONTROL: PASS; ENETUNREACH');
            let context;
            try {
              context = await launch();
              const first = await popup(context);
              console.log('FIRST_WORKER_POPUP_MESSAGE: PASS');
              await first.page.evaluate(() => chrome.storage.local.set({probe:'synthetic-persisted'}));
              await context.close(); context = undefined;
              context = await launch();
              const second = await popup(context);
              if (first.id !== second.id) throw new Error('extension id changed after restart');
              const state = await second.page.evaluate(() => chrome.storage.local.get('probe'));
              if (state.probe !== 'synthetic-persisted') throw new Error('storage did not persist');
              console.log('RESTART_WORKER_POPUP_STORAGE: PASS');
              await context.close(); context = undefined;
              console.log('RESULT: PASS; sandbox effective layers UNVERIFIED');
            } finally { if (context) await context.close(); }
          })().catch(e => { console.error('RESULT: FAIL', e.message); process.exitCode=1; });
          NODECODE

  firefox-synthetic-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Test Firefox temporary synthetic extension
        shell: bash
        run: |
          set -euo pipefail
          firefox_path="$(command -v firefox || true)"
          if [ -z "$firefox_path" ]; then echo 'BLOCKED: Firefox executable missing'; exit 2; fi
          "$firefox_path" --version
          workdir="$(mktemp -d "$RUNNER_TEMP/firefox-flow.XXXXXX")"
          trap 'rm -rf "$workdir"' EXIT
          npm install --prefix "$workdir" --ignore-scripts --no-audit --no-fund --save-exact web-ext@10.8.0
          "$workdir/node_modules/.bin/web-ext" --version
          export PROBE_ROOT="$workdir" FIREFOX_PATH="$firefox_path" MOZ_HEADLESS=1
          sudo PROBE_ROOT="$workdir" FIREFOX_PATH="$firefox_path" unshare --net -- bash -c 'ip link set lo up; exec sudo -u runner env PROBE_ROOT="$PROBE_ROOT" FIREFOX_PATH="$FIREFOX_PATH" MOZ_HEADLESS=1 python3 -' <<'PYCODE'
          import errno, http.server, json, os, pathlib, socket, subprocess, threading, time
          print('NETWORK_NAMESPACE:', os.readlink('/proc/self/ns/net'), flush=True)
          print('IP_ROUTES:', subprocess.check_output(['ip','route'],text=True).strip(), flush=True)
          print('IPV6_ROUTES:', subprocess.check_output(['ip','-6','route'],text=True).strip(), flush=True)
          sock=socket.socket(); sock.settimeout(2)
          try:
              sock.connect(('1.1.1.1',443))
              raise SystemExit('FAIL: unexpected external connection')
          except OSError as e:
              print('EXTERNAL_CONNECT_ERRNO:',e.errno,flush=True)
              if e.errno != errno.ENETUNREACH: raise SystemExit('BLOCKED: external denial not proven as no route')
          finally: sock.close()
          print('NETWORK_NEGATIVE_CONTROL: PASS, network namespace has no external route', flush=True)
          root=pathlib.Path(os.environ['PROBE_ROOT']); ext=root/'fixture'; ext.mkdir()
          event=threading.Event(); observed=[]
          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self,*args): pass
              def do_GET(self):
                  observed.append(('GET', self.path))
                  body=b'<!doctype html><title>Synthetic Firefox fixture</title><div id="probe">ready</div>'
                  self.send_response(200); self.send_header('Content-Type','text/html'); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
              def do_POST(self):
                  body=self.rfile.read(min(int(self.headers.get('Content-Length','0')),128)).decode('utf-8','replace')
                  observed.append((self.path,body))
                  self.send_response(204); self.send_header('Access-Control-Allow-Origin','*'); self.end_headers()
                  if self.path=='/proof' and body=='worker-pong': event.set()
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          url=f'http://127.0.0.1:{server.server_port}/'
          manifest={'manifest_version':2,'name':'Firefox isolated synthetic probe','version':'1.0','browser_specific_settings':{'gecko':{'id':'synthetic-probe@example.invalid'}},'background':{'scripts':['background.js']},'content_scripts':[{'matches':['http://127.0.0.1/*'],'js':['content.js']}],'permissions':['tabs','http://127.0.0.1/*']}
          (ext/'manifest.json').write_text(json.dumps(manifest))
          (ext/'background.js').write_text("browser.runtime.onMessage.addListener(m => m === 'ping' ? Promise.resolve('worker-pong') : undefined); browser.runtime.onInstalled.addListener(() => { fetch(" + json.dumps(url+'background') + ", {method:'POST',body:'started'}); browser.tabs.create({url:" + json.dumps(url) + "}); });")
          (ext/'content.js').write_text("browser.runtime.sendMessage('ping').then(r => fetch(" + json.dumps(url+'proof') + ",{method:'POST',body:r}));")
          cmd=[str(root/'node_modules/.bin/web-ext'),'run','--source-dir',str(ext),'--firefox',os.environ['FIREFOX_PATH'],'--no-reload','--start-url',url]
          logfile=root/'firefox-log.txt'
          try:
              with logfile.open('w') as log:
                  proc=subprocess.Popen(cmd,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
                  try:
                      for _ in range(120):
                          if event.wait(.5) or proc.poll() is not None: break
                      if event.is_set():
                          print('RESULT: PASS; temporary Firefox extension content script -> background -> localhost proof',flush=True)
                          processes={}
                          for entry in pathlib.Path('/proc').iterdir():
                              if not entry.name.isdigit(): continue
                              try:
                                  status=(entry/'status').read_text()
                                  fields=dict(line.split(':',1) for line in status.splitlines() if ':' in line)
                                  processes[int(entry.name)]=(entry,fields)
                              except (OSError,ValueError): pass
                          descendants={proc.pid}
                          for _ in range(12):
                              children={pid for pid,(_,fields) in processes.items() if int(fields.get('PPid','-1').strip()) in descendants}
                              if children <= descendants: break
                              descendants |= children
                          for pid in sorted(descendants):
                              if pid not in processes: continue
                              entry,fields=processes[pid]
                              try:
                                  name=fields.get('Name','?').strip()
                                  if 'firefox' in name.lower() or name in ('Web Content','RDD Process','Socket Process','Isolated Web Co'):
                                      print('FIREFOX_PROCESS:',name,'PID:',pid,'Seccomp:',fields.get('Seccomp','?').strip(),'NoNewPrivs:',fields.get('NoNewPrivs','?').strip(),'USERNS:',os.readlink(entry/'ns/user'),'NETNS:',os.readlink(entry/'ns/net'),'APPARMOR:',(entry/'attr/current').read_text().strip(),flush=True)
                              except OSError: pass
                          print('SANDBOX_STATUS: PARTIAL; process indicators do not certify all protection layers',flush=True)
                      else:
                          log.flush(); print('OBSERVED:',observed,'WEB_EXT_EXIT:',proc.poll(),flush=True)
                          print('WEB_EXT_LOG:',logfile.read_text(errors='replace')[-6000:],flush=True)
                          raise SystemExit('RESULT: BLOCKED or FAIL; proof not received')
                  finally:
                      import signal
                      try: os.killpg(proc.pid,signal.SIGTERM)
                      except ProcessLookupError: pass
                      try: proc.wait(timeout=10)
                      except subprocess.TimeoutExpired: os.killpg(proc.pid,signal.SIGKILL);proc.wait()
          finally: server.shutdown();server.server_close()
          print('SCOPE: temporary installation, synthetic localhost, Firefox restart NOT VERIFIED; external network route blocked in this test namespace',flush=True)
          PYCODE

