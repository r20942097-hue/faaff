name: Development environment readiness audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check auditor invariants
        run: python -m unittest ai.test_audit_environment ai.test_browser_preflight -v
      - name: Produce explicit source-readiness evidence
        run: python ai/audit_environment.py . --output environment-readiness.json
      - name: Upload JSON evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: environment-readiness
          path: environment-readiness.json
          retention-days: 14
          if-no-files-found: warn
