name: Isolated browser OS SIGKILL OPFS recovery (not product)

on:
  pull_request:
    paths:
      - 'ai/opfs_process_kill_fixture.py'
      - 'ai/test_opfs_process_kill_fixture.py'
      - 'ai/opfs_restart_fixture.py'
      - 'ai/chromium_renderer_crash_fixture.py'
      - 'ai/requirements-browser.txt'
      - 'ai/requirements-process.txt'
      - '.github/workflows/opfs-process-kill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-sigkill:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install browser tools
        run: python -m pip install -r ai/requirements-browser.txt -r ai/requirements-process.txt
      - name: Install isolated browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test process-group isolation and fail-closed contracts
        run: python -m unittest ai.test_opfs_process_kill_fixture -v
      - name: SIGKILL only the dedicated subprocess session, then inspect OPFS
        run: python -m ai.opfs_process_kill_fixture --browser ${{ matrix.browser }} --output opfs-process-kill-${{ matrix.browser }}.json
      - name: Upload redacted synthetic results only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: opfs-process-kill-${{ matrix.browser }}
          path: opfs-process-kill-${{ matrix.browser }}.json
          retention-days: 14
          if-no-files-found: warn
