name: Tooling data readiness validation

on:
  pull_request:
    paths:
      - 'ai/tooling-readiness.json'
      - 'ai/TOOLING_READINESS.md'
      - 'ai/check_tooling_readiness.py'
      - '.github/workflows/tooling-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Validate source/tool inventory contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate inventory and required gates
        run: python ai/check_tooling_readiness.py
      - name: Check existing AI hub
        run: python ai/check_hub.py
