name: Synthetic OPFS fault matrix (not product)

on:
  pull_request:
    paths:
      - 'ai/opfs_fault_matrix.py'
      - 'ai/test_opfs_fault_matrix.py'
      - 'ai/requirements-browser.txt'
      - '.github/workflows/opfs-fault-matrix.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fault-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned browser tooling
        run: python -m pip install -r ai/requirements-browser.txt
      - name: Install isolated browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Unit-test evidence and failure contracts
        run: python -m unittest ai.test_opfs_fault_matrix -v
      - name: Run real-browser synthetic OPFS fault matrix
        run: python -m ai.opfs_fault_matrix --browser ${{ matrix.browser }} --output opfs-fault-matrix-${{ matrix.browser }}.json
      - name: Upload JSON only (never browser profile, OPFS contents, or cookies)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: opfs-fault-matrix-${{ matrix.browser }}
          path: opfs-fault-matrix-${{ matrix.browser }}.json
          retention-days: 14
          if-no-files-found: warn
