name: Browser toolchain preflight (not product E2E)

on:
  pull_request:
    paths:
      - 'ai/browser_preflight.py'
      - 'ai/test_browser_preflight.py'
      - 'ai/requirements-browser.txt'
      - '.github/workflows/browser-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Playwright
        run: python -m pip install -r ai/requirements-browser.txt
      - name: Install browser and system dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test tooling contract
        run: python -m unittest ai.test_browser_preflight -v
      - name: Browser fixture smoke (not extension E2E)
        run: python ai/browser_preflight.py --browser ${{ matrix.browser }} --output browser-preflight-${{ matrix.browser }}.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: toolchain-${{ matrix.browser }}
          path: browser-preflight-${{ matrix.browser }}.json
          retention-days: 14
          if-no-files-found: warn
