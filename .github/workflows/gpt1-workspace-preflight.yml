name: GPT1 workspace preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self-test preflight (offline)
        run: python -m unittest discover -s ai/tests -p test_gpt1_preflight.py -v
      - name: Test pinned-upstream metadata guard (offline)
        run: python -m unittest discover -s ai/tests -p test_source_sync_guard.py -v
      - name: Test bounded ZIP artifact security gate
        run: python -m unittest discover -s ai/tests -p test_artifact_gate.py -v
      - name: Test product evidence gate (offline)
        run: python -m unittest discover -s ai/tests -p test_product_quality.py -v
      - name: Test nested extension manifest inventory (offline)
        run: python -m unittest discover -s ai/tests -p test_extension_inventory.py -v
      - name: Test offline candidate ZIP catalog
        run: python -m unittest discover -s ai/tests -p test_candidate_catalog.py -v
      - name: Validate product QA baseline without approving releases
        run: python ai/product_quality.py --json
      - name: Unit-test GitHub workflow supply-chain policy
        run: python -m unittest discover -s ai/tests -p test_workflow_supply_chain.py -v
      - name: Unit-test Actions lockfile graph parity
        run: python -m unittest discover -s ai/tests -p test_lockfile_parity.py -v
      - name: Compare locked graph with checked-out workflows
        run: python ai/lockfile_parity.py --json
      - name: Audit workflow SHA, permissions and unsafe triggers
        run: python ai/workflow_supply_chain.py --expected-repository r20942097-hue/faaff --json
      - name: Test copied-source ZIP provenance boundary (offline)
        run: python -m unittest discover -s ai/tests -p test_source_zip_parity.py -v
      - name: Test official gh attestation verifier policy with synthetic fixtures
        run: python -m unittest discover -s ai/tests -p test_attestation_verifier.py -v
      - name: Inspect checked-out repository (offline)
        run: python ai/gpt1_preflight.py --expected-repository r20942097-hue/faaff --require-git --json
