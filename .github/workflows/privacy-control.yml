name: Unified Privacy Control offline quality gates

on:
  pull_request:
    paths:
      - 'tools/privacy-control/**'
      - '.github/workflows/privacy-control.yml'
  push:
    branches: [main]
    paths:
      - 'tools/privacy-control/**'
      - '.github/workflows/privacy-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile UPC evaluation and regressions
        run: python -m compileall -q tools/privacy-control
      - name: Run UPC parser, evidence and no-release regression tests
        run: python -m unittest discover -s tools/privacy-control -p 'test_*.py' -v
      - name: Compare immutable pinned stable tracking and candidate scope
        run: |
          python tools/privacy-control/cli.py \
            --check \
            --report "$RUNNER_TEMP/upc-coverage-report.json" \
            --html "$RUNNER_TEMP/upc-static-viewer.html" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Confirm no executable blocking layer or new public list is introduced
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'upc-coverage-report.json').read_text())
          assert record['release'] == 'NO_GO'
          assert record['rules_published'] == 0
          assert record['source']['role'] == 'PINNED_NON_PUBLISHING_SNAPSHOT'
          assert record['browser_stock_coverage'] == 'NOT_RUN'
          assert record['real_engine_efficacy'] == 'NOT_RUN'
          view = (Path(os.environ['RUNNER_TEMP']) / 'upc-static-viewer.html').read_text(encoding='utf-8')
          assert "script-src 'none'" in view and '<script>' not in view
          assert view.count('<tr>') == 39
          print('UPC NO-RELEASE GATE: PASS')
          PY

  pinned-engine-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Fetch SHA-256 locked uBlock Origin engine outside checkout
        run: |
          python integrations/browser-filters/source/s/scripts/prepare_engine.py \
            --directory "$RUNNER_TEMP/upc-ublock-engine"
      - name: Install locked Ghostery engine without executing package scripts
        run: |
          npm ci \
            --prefix integrations/browser-filters/source/s/verification/ghostery \
            --ignore-scripts --no-audit --no-fund
      - name: Run pinned two-engine synthetic request matrix
        run: |
          node tools/privacy-control/engine_matrix.mjs \
            --engine-dir "$RUNNER_TEMP/upc-ublock-engine" \
            --ghostery-entry "integrations/browser-filters/source/s/verification/ghostery/node_modules/@ghostery/adblocker/dist/esm/index.js" \
            --report "$RUNNER_TEMP/upc-engine-matrix.json"
      - name: Fail on missing or overstated actual-engine report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads((Path(os.environ['RUNNER_TEMP']) / 'upc-engine-matrix.json').read_text())
          assert x['schema'] == 'upc-engine-matrix/v1'
          assert x['result'] == 'PASS'
          assert x['pinned_tracking_rules'] == 47
          assert x['requests_compared'] == 568
          assert x['exception_controls'] == 4
          assert x['synthetic_only'] is True
          assert x['actual_stock_lists_enabled'] == 'NOT_RUN'
          assert x['live_site_compatibility'] == 'NOT_RUN'
          assert x['publication'] == 'NO_GO'
          print('UPC ENGINE EVIDENCE: PASS 568 synthetic comparisons incl. exception controls, live sites NOT_RUN')
          PY

  pinned-upstream-stock-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download five immutable EasyPrivacy source fragments
        run: python tools/privacy-control/fetch_stock.py --output-dir "$RUNNER_TEMP/upc-selected-stock"
      - name: Prepare pinned uBlock Origin engine outside repository
        run: |
          python integrations/browser-filters/source/s/scripts/prepare_engine.py \
            --directory "$RUNNER_TEMP/upc-engine"
      - name: Install pinned Ghostery parser without install scripts
        run: |
          npm ci --prefix integrations/browser-filters/source/s/verification/ghostery \
            --ignore-scripts --no-audit --no-fund
      - name: Compare synthetic matching with and without candidate rules
        run: |
          node tools/privacy-control/compare_stock.mjs \
            --stock-dir "$RUNNER_TEMP/upc-selected-stock" \
            --engine-dir "$RUNNER_TEMP/upc-engine" \
            --ghostery-entry "integrations/browser-filters/source/s/verification/ghostery/node_modules/@ghostery/adblocker/dist/esm/index.js" \
            --report "$RUNNER_TEMP/upc-stock-comparison.json"
      - name: Require honest selected-component report and no publication
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "upc-stock-comparison.json").read_text())
          c = result["counts"]
          assert result["schema"] == "upc-stock-fragment-comparison/v1"
          assert result["result"] == "PASS"
          assert c["source_components"] == 5
          assert c["candidates"] == 38 and c["cases"] == 228
          assert c["engine_observations"] == 912
          assert len(result["findings"]) == 228
          assert result["selected_upstream_fragments_not_full_list"] is True
          assert result["actual_browser_enabled_lists"] == "NOT_VERIFIED"
          assert result["production_browser_site_e2e"] == "NOT_RUN"
          assert result["adopted_rules"] == 0 and result["publication"] == "NO_GO"
          assert all(row["real_site_incremental_efficacy"] == "NOT_ESTABLISHED" for row in result["findings"])
          assert c["baseline_regressions"]["ubo"] == 0 and c["baseline_regressions"]["ghostery"] == 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## EasyPrivacy pinned subset — synthetic stock overlap\n\n")
              f.write("Selected components: 5, candidates: 38, fixture cases: 228, two-engine observations: 912.\n\n")
              f.write(f"Baseline matched: uBO {c['selected_source_baseline_blocked']['ubo']}, Ghostery {c['selected_source_baseline_blocked']['ghostery']}.\n\n")
              f.write(f"Additional synthetic matches: uBO {c['additional_synthetic_blocks']['ubo']}, Ghostery {c['additional_synthetic_blocks']['ghostery']}.\n\n")
              f.write(f"Engine disagreements: baseline {c['engine_disagreements']['baseline']}, combined {c['engine_disagreements']['combined']}.\n\n")
              f.write("**Not full EasyPrivacy or verified active browser stock; not real-site efficacy; adoption 0, release NO_GO.**\n")
          print("UPC STOCK SUBSET GATE PASS:", c)
          PY
