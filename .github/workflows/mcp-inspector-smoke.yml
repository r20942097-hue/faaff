name: MCP Inspector isolated CLI verification

on:
  pull_request:
    paths:
      - '.github/workflows/mcp-inspector-smoke.yml'
      - 'integrations/agent-tools/mcp-inspector/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stdio-only:
    name: Inspector v2 local stdio tools/list + tools/call
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with no persisted Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Check deterministic MCP fixture
        shell: bash
        run: node --check integrations/agent-tools/mcp-inspector/mock-stdio-server.mjs
      - name: Check negative tool calls and JSON-RPC notification semantics
        shell: bash
        run: |
          node --check integrations/agent-tools/mcp-inspector/contract-check.mjs
          node integrations/agent-tools/mcp-inspector/contract-check.mjs
      - name: Install pinned MCP Inspector CLI only into temporary runner directory
        shell: bash
        run: |
          set -euo pipefail
          # Use committed integrity-locked transitive npm dependency graph.
          npm ci --prefix integrations/agent-tools/mcp-inspector --no-audit --no-fund --ignore-scripts
          inspector="$GITHUB_WORKSPACE/integrations/agent-tools/mcp-inspector/node_modules/.bin/mcp-inspector"
          test -x "$inspector"
          echo "MCP_INSPECTOR_BIN=$inspector" >> "$GITHUB_ENV"
          "$inspector" --cli --help >/dev/null
      - name: Gate high/critical npm advisories for locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --prefix integrations/agent-tools/mcp-inspector --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/npm-audit.json" "$audit_status" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          const vuln = report.metadata?.vulnerabilities;
          if (report.error || !vuln || ![0, 1].includes(status)) {
            console.error('npm advisory query failed or returned an incomplete report.');
            process.exit(1);
          }
          console.log('Published npm advisory counts: ' +
            ['critical', 'high', 'moderate', 'low', 'total']
              .map(key => key + '=' + (vuln[key] ?? 0)).join(' '));
          if ((vuln.critical ?? 0) > 0 || (vuln.high ?? 0) > 0) {
            console.error('Known high/critical npm vulnerabilities violate the CI gate.');
            process.exit(1);
          }
          NODE
      - name: Validate stdio tools/list and schema portability
        shell: bash
        run: |
          set -euo pipefail
          server="$GITHUB_WORKSPACE/integrations/agent-tools/mcp-inspector/mock-stdio-server.mjs"
          "$MCP_INSPECTOR_BIN" --cli node "$server" --method tools/list --format json --strict > "$RUNNER_TEMP/mcp-tools.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!r.result?.tools?.some(t=>t.name==="echo_text")) process.exit(1); console.log("PASS: tool listed")' "$RUNNER_TEMP/mcp-tools.json"
      - name: Verify Inspector initialize handshake and declared capabilities
        shell: bash
        run: |
          set -euo pipefail
          server="$GITHUB_WORKSPACE/integrations/agent-tools/mcp-inspector/mock-stdio-server.mjs"
          "$MCP_INSPECTOR_BIN" --cli node "$server" --method initialize --format json --connect-timeout 10000 > "$RUNNER_TEMP/mcp-initialize.json"
          node - "$RUNNER_TEMP/mcp-initialize.json" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const value = response.result;
          if (value?.serverInfo?.name !== 'synthetic-mcp-echo' || !value?.capabilities?.tools) {
            console.error('Incorrect MCP initialize handshake or capabilities');
            process.exit(1);
          }
          console.log('PASS: Inspector completed MCP initialize handshake');
          NODE
      - name: Validate stdio tools/call
        shell: bash
        run: |
          set -euo pipefail
          server="$GITHUB_WORKSPACE/integrations/agent-tools/mcp-inspector/mock-stdio-server.mjs"
          "$MCP_INSPECTOR_BIN" --cli node "$server" --method tools/call --tool-name echo_text --tool-arg text=hello --format json > "$RUNNER_TEMP/mcp-call.json"
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!r.result?.content?.some(c=>c.type==="text" && c.text==="hello")) process.exit(1); console.log("PASS: fixture tool called")' "$RUNNER_TEMP/mcp-call.json"
      - name: Verify Inspector classifies tool-result isError:true as exit 5
        shell: bash
        run: |
          set -euo pipefail
          server="$GITHUB_WORKSPACE/integrations/agent-tools/mcp-inspector/mock-stdio-server.mjs"
          set +e
          "$MCP_INSPECTOR_BIN" --cli node "$server" --method tools/call --tool-name always_deny --tool-args-json '{}' --format json --connect-timeout 10000 > "$RUNNER_TEMP/mcp-reject.json" 2> "$RUNNER_TEMP/mcp-reject.stderr"
          status=$?
          set -e
          if [[ "$status" -ne 5 ]]; then
            echo "Inspector failed to classify a rejected tool invocation: expected exit 5, got $status"
            exit 1
          fi
          echo 'PASS: Inspector negative tools/call returned tool-error exit 5'
