name: Dedicated Worker OPFS sync handles (not product)

on:
  pull_request:
    paths:
      - 'ai/opfs_worker_sync_fixture.py'
      - 'ai/test_opfs_worker_sync_fixture.py'
      - 'ai/requirements-browser.txt'
      - '.github/workflows/opfs-worker-sync-fixture.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  worker-opfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install verified Playwright
        run: python -m pip install -r ai/requirements-browser.txt
      - name: Install clean browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run worker contract unit tests
        run: python -m unittest ai.test_opfs_worker_sync_fixture -v
      - name: Verify dedicated worker sync OPFS flush and lock
        run: python -m ai.opfs_worker_sync_fixture --browser ${{ matrix.browser }} --output opfs-worker-${{ matrix.browser }}.json
      - name: Preserve sanitized JSON evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: opfs-worker-${{ matrix.browser }}
          path: opfs-worker-${{ matrix.browser }}.json
          retention-days: 14
          if-no-files-found: warn
