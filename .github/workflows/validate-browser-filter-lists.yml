name: Validate browser filter lists

on:
  push:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"
  pull_request:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python browser_filter_lists/scripts/validate_filters.py
