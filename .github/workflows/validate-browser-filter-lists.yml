name: Validate browser filter lists

on:
  push:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"
  pull_request:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Compile validators
        run: python -m compileall -q browser_filter_lists/scripts
      - name: Run stable-list regression tests
        run: python browser_filter_lists/scripts/test_validator.py
      - name: Run evidence regression tests
        run: python browser_filter_lists/scripts/test_evidence.py
      - name: Run promotion-gate regression tests
        run: python browser_filter_lists/scripts/test_promotion.py
      - name: Validate published lists
        run: python browser_filter_lists/scripts/validate_filters.py
      - name: Validate candidate evidence freshness
        run: python browser_filter_lists/scripts/validate_candidate_evidence.py
      - name: Validate candidate promotion gates
        run: python browser_filter_lists/scripts/validate_candidate_promotion.py
      - name: Check generated candidate report
        run: python browser_filter_lists/scripts/render_candidate_report.py --check
