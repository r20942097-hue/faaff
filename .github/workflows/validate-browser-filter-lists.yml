name: Validate browser filter lists

on:
  push:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"
  pull_request:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compile validators
        run: python -m compileall -q browser_filter_lists/scripts
      - name: Run all filter and registry regression tests
        run: python -m unittest discover -s browser_filter_lists/scripts -p 'test_*.py' -v
      - name: Validate published lists
        run: python browser_filter_lists/scripts/validate_filters.py
      - name: Validate candidate evidence freshness
        run: python browser_filter_lists/scripts/validate_candidate_evidence.py
      - name: Validate candidate promotion gates
        run: python browser_filter_lists/scripts/validate_candidate_promotion.py
      - name: Check generated candidate report
        run: python browser_filter_lists/scripts/render_candidate_report.py --check
