name: Validate browser filter lists

on:
  push:
    paths:
      - "browser_filter_lists/**"
      - ".github/workflows/validate-browser-filter-lists.yml"
  # PR では全変更で実行する（main の Ruleset 必須チェックのため、パス絞り込みなし）
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compile validators
        run: python -m compileall -q browser_filter_lists/scripts
      - name: Run all filter and registry regression tests
        run: python -m unittest discover -s browser_filter_lists/scripts -p 'test_*.py' -v
      - name: Validate published lists
        run: python browser_filter_lists/scripts/validate_filters.py
      - name: Validate candidate evidence freshness
        run: python browser_filter_lists/scripts/validate_candidate_evidence.py
      - name: Validate candidate promotion gates
        run: python browser_filter_lists/scripts/validate_candidate_promotion.py
      - name: Check generated candidate report
        run: python browser_filter_lists/scripts/render_candidate_report.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned lint tooling (lockfile, no install scripts)
        run: npm ci --prefix browser_filter_lists/tooling --ignore-scripts --no-audit --no-fund
      - name: Independent syntax lint of published lists (AGLint)
        working-directory: browser_filter_lists
        run: ./tooling/node_modules/.bin/aglint filters/*.txt
      - name: AGLint negative control (invalid rules must be rejected)
        working-directory: browser_filter_lists
        run: |
          set +e
          out="$(./tooling/node_modules/.bin/aglint tooling/control/bad.txt 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 1 ] && grep -q 'invalid-modifiers' <<<"$out"
