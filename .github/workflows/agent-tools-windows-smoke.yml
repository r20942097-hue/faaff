name: Windows agent tool installer smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dry-run:
    name: PowerShell safe no-install validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate preview, options, and rejected conflicting requests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = '.\\integrations\\agent-tools\\agent-reach-skillspector\\Install-AgentReach-SkillSpector.ps1'
          $base = (& $scriptPath -DryRun -Target Both | Out-String)
          if ($base -notmatch 'No commands executed') { throw 'DryRun guarantee missing' }
          $single = (& $scriptPath -DryRun -Target SkillSpector | Out-String)
          if ($single -notmatch 'SkillSpector') { throw 'Target selection failed' }
          $without = (& $scriptPath -DryRun -Target AgentReach | Out-String)
          if ($without -match 'PLAN: agent-reach setup') { throw 'Setup unexpectedly enabled' }
          $with = (& $scriptPath -DryRun -Target AgentReach -RunSetup | Out-String)
          if ($with -notmatch 'PLAN: agent-reach setup') { throw 'Explicit setup planning failed' }
          $threw = $false
          try { & $scriptPath -DryRun -RunSetup -SkipSetup | Out-Null } catch { $threw = $true }
          if (-not $threw) { throw 'Conflicting flags should be rejected' }
          Write-Host 'PASS: Windows offline option smoke only; no third-party installation performed.'
