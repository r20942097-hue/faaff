name: AI hub import safety regression

on:
  pull_request:
    paths:
      - 'ai/**'
      - '.github/workflows/ai-hub-import-safety.yml'
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-hub-import-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-safety:
    name: import-safety (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14', '3.15.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact interpreter version
        run: python -VV
      - name: Import-safety regression tests
        run: python -m unittest discover -s ai/tests -p 'test_*.py' -v
