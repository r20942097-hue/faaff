name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  security-events: write
  packages: read

jobs:
  source-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report source state
        shell: bash
        run: |
          if [[ -f rplay_watcher/__init__.py ]]; then
            echo "Python source tree present."
          else
            echo "Bootstrap/source-sync state: Python source tree not present."
          fi
          if compgen -G "extension/*.js" > /dev/null; then
            echo "JavaScript source tree present."
          else
            echo "Bootstrap/source-sync state: JavaScript source tree not present."
          fi

  analyze-python:
    if: ${{ hashFiles('rplay_watcher/**/*.py') != '' }}
    needs: source-state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python

  analyze-javascript:
    if: ${{ hashFiles('extension/**/*.js') != '' }}
    needs: source-state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript
