name: Dependency Review

# Repository-native Dependency Review is currently unsupported for this private
# repository configuration. Keep this workflow manual-only so an unsupported
# capability is not confused with a vulnerability finding or used as a PR gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report unsupported capability
        shell: bash
        run: |
          echo "::error title=Dependency Review NOT_RUN::Repository-native Dependency Review is unsupported for the current repository configuration. This is not a vulnerability scan result."
          echo "status=NOT_RUN"
          echo "capability=UNSUPPORTED"
          echo "vulnerability_posture=UNKNOWN"
          exit 1
