name: Chromium renderer crash OPFS recovery (not product)

on:
  pull_request:
    paths:
      - 'ai/chromium_renderer_crash_fixture.py'
      - 'ai/test_chromium_renderer_crash_fixture.py'
      - 'ai/requirements-browser.txt'
      - '.github/workflows/chromium-renderer-crash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned browser tools
        run: python -m pip install -r ai/requirements-browser.txt
      - name: Install temporary Chromium
        run: python -m playwright install --with-deps chromium
      - name: Unit test renderer-crash assertions
        run: python -m unittest ai.test_chromium_renderer_crash_fixture -v
      - name: Crash disposable renderer and inspect durable OPFS
        run: python -m ai.chromium_renderer_crash_fixture --output chromium-renderer-crash.json
      - name: Upload JSON without profile or crash dump
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: chromium-renderer-crash
          path: chromium-renderer-crash.json
          retention-days: 14
          if-no-files-found: warn
