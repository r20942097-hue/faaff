name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Source synchronization check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if ZIP/7z archives are tracked
        shell: bash
        run: |
          if git ls-files | grep -iE '\.(zip|7z)$'; then
            echo "::error::ZIP/7z archives must not be committed (see AGENTS.md)"
            exit 1
          fi
      - id: check
        name: Classify runtime source state
        shell: bash
        run: |
          required_paths=(
            rplay_watcher/__init__.py
            pyproject.toml
            extension/bridge.js
            extension/content.js
            extension/popup.js
            extension/options.js
            tests
          )
          runtime_markers=(rplay_watcher extension tests)
          runtime_seen=false
          for marker in "${runtime_markers[@]}"; do
            if [[ -e "$marker" ]]; then
              runtime_seen=true
              break
            fi
          done
          missing=()
          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              missing+=("$path")
            fi
          done
          if [[ "$runtime_seen" == false ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Runtime source gate"
              echo "- Source: **BOOTSTRAP_ONLY**"
              echo "- Product tests: **NOT_RUN** (runtime source absent)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Runtime source absent; product tests NOT_RUN."
          elif (( ${#missing[@]} > 0 )); then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Runtime source gate"
              echo "- Source: **PARTIAL_SOURCE**"
              echo "- Product tests: **BLOCKED** (required paths missing)"
              printf -- '- Missing: %s\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '::error::Partial runtime source, missing %s\n' "${missing[*]}"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Runtime source gate"
              echo "- Source: **COMPLETE_SOURCE** (structural check only)"
              echo "- Product tests: **SCHEDULED** (results must be checked separately)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: source-check
    if: needs.source-check.outputs.source_present == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q rplay_watcher
      - name: Check extension JavaScript
        shell: bash
        run: |
          node --check extension/bridge.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/options.js
      - name: Smoke CLI
        run: rplay-watcher --version
