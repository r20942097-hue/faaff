name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Source synchronization check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if ZIP/7z archives are tracked
        shell: bash
        run: |
          if git ls-files | grep -iE '\.(zip|7z)$'; then
            echo "::error::ZIP/7z archives must not be committed (see AGENTS.md)"
            exit 1
          fi
      - id: check
        name: Check source tree
        shell: bash
        run: |
          if [[ -f rplay_watcher/__init__.py && -f pyproject.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Complete source tree detected; full CI will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Repository is in bootstrap/source-sync state; full runtime CI is intentionally not claimed."
          fi

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: source-check
    if: needs.source-check.outputs.source_present == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q rplay_watcher
      - name: Check extension JavaScript
        shell: bash
        run: |
          node --check extension/bridge.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/options.js
      - name: Smoke CLI
        run: rplay-watcher --version

  tooling-audit-smoke:
    name: actionlint + zizmor smoke (proposal only)
    if: github.event_name == 'pull_request' && github.head_ref == 'proposal/github-devtools-audit-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and execute checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          "$RUNNER_TEMP/actionlint/actionlint" -oneline
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and execute offline report-only zizmor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: 'zizmor==1.31.1'
          zizmor --version
          zizmor --offline --format=plain --no-exit-codes .

  gitleaks-smoke:
    name: Gitleaks redacted scanning smoke (proposal only)
    if: github.event_name == 'pull_request' && github.head_ref == 'proposal/github-devtools-audit-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR and baseline Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run network-disabled redacted secrets scanner (non-blocking findings)
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f'
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" \
            git --redact=100 --no-banner --no-color --exit-code 0 --log-opts="origin/main..HEAD" .
