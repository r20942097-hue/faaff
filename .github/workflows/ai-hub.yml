name: AI hub and pinned filter source

on:
  # PR では全変更で実行する（main の Ruleset 必須チェックのため、パス絞り込みなし）
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'ai/**'
      - 'integrations/browser-filters/**'
      - '.github/workflows/ai-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14', '3.15.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter version
        run: python --version
      - name: Verify AI index and pinned Git blob hashes
        run: python ai/check_hub.py
      - name: AI hub state/import regression tests
        run: python -m unittest discover -s ai/tests -p 'test_*.py' -v
      - name: Imported source unit tests
        run: python -m unittest discover -s integrations/browser-filters/source/s/tests -p 'test_*.py' -v
      - name: Imported list and include validation
        run: python integrations/browser-filters/source/s/scripts/validate_lists.py
      - name: Imported generated-list parity
        run: python integrations/browser-filters/source/s/scripts/generate_lists.py --check

  # Optional Windows parity probe; required Linux check contexts remain stable.
  windows315-compat:
    name: Windows Python 3.15.2 compatibility
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve canonical LF bytes before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Show interpreter version
        run: python --version
      - name: Verify hub and pinned source integrity
        run: python ai/check_hub.py
      - name: Run AI decision and state regression tests
        run: python -m unittest discover -s ai/tests -p 'test_*.py' -v
      - name: Run pinned filter unit tests
        run: python -m unittest discover -s integrations/browser-filters/source/s/tests -p 'test_*.py' -v
      - name: Validate pinned filters
        run: python integrations/browser-filters/source/s/scripts/validate_lists.py
      - name: Verify pinned filter generation parity
        run: python integrations/browser-filters/source/s/scripts/generate_lists.py --check
