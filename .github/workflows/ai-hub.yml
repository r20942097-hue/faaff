name: AI hub and pinned filter source

on:
  # PR では全変更で実行する（main の Ruleset 必須チェックのため、パス絞り込みなし）
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'ai/**'
      - 'integrations/browser-filters/**'
      - '.github/workflows/ai-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-import:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
                include:
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14.10'}
          - {os: ubuntu-latest, python-version: '3.15.2'}
          - {os: windows-latest, python-version: '3.14.10'}
          - {os: windows-latest, python-version: '3.15.2'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact interpreter version
        run: python -VV
      - name: Verify AI index and pinned Git blob hashes
        run: python ai/check_hub.py
      - name: Imported source unit tests
        run: python -m unittest discover -s integrations/browser-filters/source/s/tests -p 'test_*.py' -v
      - name: Imported list and include validation
        run: python integrations/browser-filters/source/s/scripts/validate_lists.py
      - name: Imported generated-list parity
        run: python integrations/browser-filters/source/s/scripts/generate_lists.py --check
