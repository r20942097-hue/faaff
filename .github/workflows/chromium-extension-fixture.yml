name: Chromium MV3 fixture E2E (not product)

on:
  pull_request:
    paths:
      - 'ai/extension_fixture_e2e.py'
      - 'ai/test_extension_fixture_e2e.py'
      - 'ai/archive_intake.py'
      - 'ai/test_archive_intake.py'
      - 'ai/requirements-browser.txt'
      - '.github/workflows/chromium-extension-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-extension-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install locked Playwright
        run: python -m pip install -r ai/requirements-browser.txt
      - name: Install Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Unit tests for isolated extension and ZIP intake
        run: python -m unittest ai.test_extension_fixture_e2e ai.test_archive_intake -v
      - name: Verify disposable MV3 content script and service worker messaging
        run: python ai/extension_fixture_e2e.py --output chromium-extension-fixture.json
      - name: Upload reproducible scope-limited evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: chromium-mv3-fixture
          path: chromium-extension-fixture.json
          retention-days: 14
          if-no-files-found: warn
