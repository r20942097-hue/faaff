name: Browser test infrastructure smoke

on:
  pull_request:
    paths:
      - '.github/workflows/browser-testing-smoke.yml'
      - 'integrations/browser-testing/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-mv3-and-patched-firefox:
    name: Playwright 1.64.1 isolated synthetic browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Playwright runtime without npm lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          # npm ci checks the committed lock and verifies registry integrity hashes.
          npm ci --prefix integrations/browser-testing --no-audit --no-fund --ignore-scripts
          node --check integrations/browser-testing/smoke.mjs
          node --check integrations/browser-testing/fixture-mv3/background.js
          node --check integrations/browser-testing/fixture-mv3/popup.js
      - name: Gate high/critical npm advisories for locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --prefix integrations/browser-testing --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          set -e
          node - "$RUNNER_TEMP/npm-audit.json" "$audit_status" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          const vuln = report.metadata?.vulnerabilities;
          if (report.error || !vuln || ![0, 1].includes(status)) {
            console.error('npm advisory query failed or returned an incomplete report.');
            process.exit(1);
          }
          console.log('Published npm advisory counts: ' +
            ['critical', 'high', 'moderate', 'low', 'total']
              .map(key => key + '=' + (vuln[key] ?? 0)).join(' '));
          if ((vuln.critical ?? 0) > 0 || (vuln.high ?? 0) > 0) {
            console.error('Known high/critical npm vulnerabilities violate the CI gate.');
            process.exit(1);
          }
          NODE
      - name: Verify MV3 Chromium and synthetic Firefox page
        env:
          # The container job runs as root; /github/home is owned by pwuser.
          # Firefox requires HOME to be owned by the launching user.
          HOME: /root
        shell: bash
        run: |
          set -euo pipefail
          node integrations/browser-testing/smoke.mjs
