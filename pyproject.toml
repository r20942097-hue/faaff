# NOTE: main には rplay_watcher/ パッケージ（ランタイムソース）が存在しません。
# 現状このファイルではインストールできません。ソースの同期・分離の判断は
# ai/WORK_QUEUE.md の関連項目を参照してください。
[build-system]
requires = ["setuptools>=76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-live-watcher"
dynamic = ["version"]
description = "Universal Live Watcher"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Universal Live Watcher contributors"}]
dependencies = []

[project.scripts]
rplay-watcher = "rplay_watcher.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "rplay_watcher.__version__"}

[tool.setuptools.packages.find]
include = ["rplay_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
